backend:
  name: github
  repo: halacsy/tanitani-online
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  # Publikáláskor egyetlen commit kerüljön a main ágra.
  squash_merges: true

# A helyi decap-server csak localhoston kapcsolódik; productionben a GitHub backend marad.
local_backend: true

# Piszkozatmentés és szerkesztői publikálási folyamat (#13).
# A mentés nem a main ágra ír, hanem a "cms/<gyűjtemény>/<slug>" ágra és egy
# pull requestre. A production oldal csak a publikálás (merge) után változik.
publish_mode: editorial_workflow
show_preview_links: true

site_url: https://www.tani-tani.info
display_url: https://www.tani-tani.info

media_folder: public/images/cikkek
public_folder: /images/cikkek

locale: hu

# Ékezetmentes ASCII webcím minden új bejegyzéshez (#12).
# "Árvíztűrő tükörfúrógép" → "arvizturo-tukorfurogep".
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: oldalak
    label: Oldalak
    label_singular: Oldal
    media_folder: /public/images/oldalak
    public_folder: /images/oldalak
    files:
      - label: Szerzői útmutató
        name: szerzoinknek
        file: content/oldalak/szerzoinknek.md
        preview_path: /archivum/szerzoinknek
        fields:
          - { label: Cím, name: title, widget: string }
          - { label: Történeti azonosító, name: migratedId, widget: hidden, default: 405 }
          - { label: Oldal szövege, name: body, widget: markdown }
      - label: Könyvek bevezetője
        name: konyvek
        file: content/oldalak/konyvek-bevezeto.md
        preview_path: /konyvek
        fields:
          - { label: Cím, name: title, widget: string }
          - { label: Bevezető, name: body, widget: markdown }
      - label: Kapcsolat
        name: kapcsolat
        file: content/oldalak/kapcsolat.md
        preview_path: /archivum/kapcsolat_
        fields:
          - { label: Cím, name: title, widget: string }
          - { label: Történeti azonosító, name: migratedId, widget: hidden, default: 221 }
          - { label: Oldal szövege, name: body, widget: markdown }
      - label: Impresszum
        name: impresszum
        file: content/oldalak/impresszum.md
        preview_path: /archivum/impresszum
        fields:
          - { label: Cím, name: title, widget: string }
          - { label: Történeti azonosító, name: migratedId, widget: hidden, default: 2 }
          - { label: Bevezető, name: body, widget: markdown }
          - label: A szerkesztőség
            name: editors
            widget: list
            fields:
              - label: Szerzői profil
                name: authorSlug
                widget: relation
                collection: szerzok
                search_fields: [name]
                value_field: "{{slug}}"
                display_fields: [name]
                required: false
              - { label: Név, name: name, widget: string }
              - { label: Feladat, name: role, widget: string }
              - { label: Fotó, name: photo, widget: image, required: false }
          - { label: Záró szöveg, name: closing, widget: markdown }
      - label: Jogi nyilatkozat
        name: jogi_nyilatkozat
        file: content/oldalak/jogi-nyilatkozat.md
        preview_path: /archivum/jogi_nyilatkozat
        fields:
          - { label: Cím, name: title, widget: string }
          - { label: Történeti azonosító, name: migratedId, widget: hidden, default: 590 }
          - { label: Oldal szövege, name: body, widget: markdown }

  - name: konyvek
    label: Könyvek
    label_singular: Könyv
    folder: content/konyvek
    create: true
    extension: yml
    format: yaml
    slug: "{{slug}}"
    media_folder: /public/images/konyvek
    public_folder: /images/konyvek
    preview_path: /konyvek#{{slug}}
    fields:
      - { label: Cím, name: title, widget: string }
      - { label: Szerzők és szerkesztők, name: creators, widget: string }
      - { label: Kiadási adatok, name: publication, widget: string }
      - { label: Borító, name: cover, widget: image }
      - { label: Sorrend, name: order, widget: number, value_type: int, min: 1 }
      - label: Letöltések és előnézetek
        name: links
        widget: list
        fields:
          - { label: Felirat, name: label, widget: string }
          - { label: Webcím, name: url, widget: string }
      - { label: Leírás, name: description, widget: markdown }

  - name: cikkek
    label: Cikkek
    label_singular: Cikk
    folder: content/cikkek
    create: true
    slug: "{{slug}}"
    preview_path: /cikkek/{{slug}}
    fields:
      - label: Cím
        name: title
        widget: string
        required: true
        hint: >-
          A webcím ebből készül, ékezetek nélkül: "Árvíztűrő tükörfúrógép" →
          /cikkek/arvizturo-tukorfurogep. Mentés után a webcím már nem változik.

      - label: Történeti cikk felülírása
        name: overrideMigrated
        widget: hidden
        default: true
        required: false

      - label: Történeti azonosító
        name: migratedId
        widget: hidden
        required: false

      - label: Szerző(k)
        name: authorSlugs
        widget: relation
        collection: szerzok
        search_fields: [name]
        value_field: "{{slug}}"
        display_fields: [name]
        multiple: true
        required: true
        hint: "Válassz a szerzők közül. Ha nincs a listában, előbb vedd fel a Szerzők menüben."

      - label: Megjelenés dátuma
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: true

      - label: Témakörök
        name: tags
        widget: list
        hint: "pl. oktatáspolitika, pedagógusok, SNI"

      - label: Összefoglaló
        name: excerpt
        widget: text
        required: true
        hint: "2-3 mondatos összefoglaló, ez jelenik meg a kártyákon"

      - label: Borítókép
        name: coverImage
        widget: image
        required: false
        hint: "Ajánlott: 1200×630px, fekvő formátum"

      - label: Borítókép helyettesítő szövege
        name: coverAlt
        widget: string
        required: false

      - label: Borítókép képaláírása
        name: coverTitle
        widget: string
        required: false

      - label: Olvasások száma
        name: reads
        widget: number
        default: 0
        required: false

      - label: Cikk szövege
        name: body
        widget: markdown
        required: true
        hint: >-
          Az eszköztár szándékosan csak jelentés szerinti (szemantikus)
          elemeket ad: félkövér, dőlt, link, két címsorszint, felsorolás,
          számozott lista, idézet és kódblokk. Elválasztóvonalat a "+" gombbal,
          az "Elválasztóvonal" elem beszúrásával adhatsz hozzá. Szándékosan
          nincs igazítás-, betűméret- vagy behúzásváltoztató gomb – lásd
          docs/cikk-szoveg-formazasa.md.
        editor_components:
          - image
          - code-block
          - horizontal-rule
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list

  - name: szerzok
    label: Szerzők
    label_singular: Szerző
    folder: content/szerzok
    create: true
    slug: "{{slug}}"
    preview_path: /szerzok/{{slug}}
    media_folder: /public/images/szerzok
    public_folder: /images/szerzok
    fields:
      - label: Teljes név
        name: name
        widget: string
        required: true
        hint: >-
          A szerzői oldal webcíme ebből készül, ékezetek nélkül:
          "Knausz Imre" → /szerzok/knausz-imre.

      - label: Portréfotó
        name: photo
        widget: image
        required: false
        hint: "Ajánlott: négyzetarányú, min. 300×300px"

      - label: Bemutatkozás
        name: bio
        widget: markdown
        buttons: [bold, italic, link, bulleted-list, numbered-list]
        editor_components: []
        required: false
        hint: "2-3 mondat, 1. személyben"
