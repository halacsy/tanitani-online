description: "„Az olvasó részletes leírást kap arról, hogyan működik egy tanoda a mindennapokban. Továbbá azt is bemutatják a szerzők, hogy miért\_szükségesek, és milyen pedagógiai funkciókkal bírnak a szakirodalom által extrakurrikuláris programoknak nevezett tevékenységek.\_S ez a kötet egyik legfontosabb eredménye: a Toldi Tanoda alapítói\_explicit módon megmutatják, hogy ezek a – közoktatásban gyakran\_feleslegesnek látszó, a direkt tanításhoz viszonyítva komolytalannak\_tűnő – programok mekkora értékkel rendelkeznek, és milyen központi\_szerepet tölthetnek be a személyiségfejlődés támogatásában.”\n\n(Fejes József Balázs, Motiváció Műhely, SZTE,\_Szűcs Norbert, Motiváció Műhely)\n\n„Nincs itt okoskodás, fellengzősség, világmegváltási szándék.\_Egyszerűen a gyerekek szeretete, tisztelete, az emberi méltóságuk\_elismerése, a személyre szabott figyelem volt és van a középpontban.\_És mérhetetlen szabadság. Azzal, hogy szabad kezet kaptak az önkéntesek, akiket elvarázsoltak a toldi gyerekek, lehetőséget kaptak arra,\_hogy szabadon kísérletezzenek, hogy rátaláljanak a gyerekek számára\_legcélravezetőbb módszerekre, technikákra.”\n\n(Galambos Rita, tréner, mediátor, a DIA korábbi igazgatója)\n\n_Szerintünk ennek a könyvnek a piaci ára 4990 Ft lenne. Ha úgy érzi, szívesen kifizetné, kérjük, utalja át ezt az összeget az Igazgyöngy Alapítvány számlájára. A számlaszám: 11738046-20048343. Közlemény: Toldi Tanoda. Köszönjük!_"
