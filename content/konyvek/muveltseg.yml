description: "Ez a kötet egyfelől védőbeszéd a műveltség, közelebbről az ún. hagyományos műveltség mellett. Amellett érvel, hogy a hatékony politikai részvétel és demokratikus ellenőrzés hiánya összefügg a tudáselosztás egyenlőtlenségeivel, ezért a műveltség demokratizálása nélkül nincs működő demokrácia. Másfelől a könyv vádbeszéd a hagyományos iskola ellen. A modern tömegoktatás a deklarációk ellenére ma már egyre kevésbé tölti be szerepét, és a műveltség terjesztése helyett inkább elzárja attól a tömegeket: műveltségközvetítést játszik, de csak a műveletlenséget termeli újra. A kötet a szerző 2010-es címadó hosszú esszéjét tartalmazza, továbbá 22 rövid írást, amelyek zömmel előadások voltak eredetileg. Nem rendszeres neveléselmélet, de a pedagógia alapkérdéseit járja körül: kísérletek gyűjteménye.\n\n_„Knausz egyszerre konzervatív-archaikus és posztmodern szerző. Konzervatív és archaikus, mert hisz a klasszikus műveltség jelentőségében, mert kérdései és válaszai antik filozófusokra, régi és kortárs katolikus gondolkozókra is ugyanúgy alapoznak, mint a modern pedagógiai elméletekre. \\[…\\] Posztmodern, mert kifejtéseiben keverednek a magas és a populáris kultúrából, a mindennapokból és a személyes emlékekből hozott példák. Radikálisan eklektikus. Knausz használja sokrétű kulturális tudását, stílusával, felhasznált eszközeivel is bizonyítja azt, amit mond, a műveltségnek (meggyőzési) kompetenciaként való alkalmazását.”_\n\nArató László középiskolai tanár, ELTE Radnóti Miklós Gyakorló Általános Iskola és Gyakorló Gimnázium\_\n\n_„Knausz Imre sajátos értékeket képvisel, jelenít meg a magyar pedagógiában a műveivel. A lektorált könyv eddigi műveinek egy válogatott gyűjteménye, azonban nem a gyűjtemény darabjaira széteső «konglomerátum», hanem nagyon határozott pedagógiai elveket egységesen megjelenítő mű. A sajátos értékek természetesen markánsan jelen vannak: szinte könyörtelen fogalmi tisztaságra törekvés, értékelvűség, de a tudományos háttér megvilágításával, mély elemzés, vagyis a felszínességnek még a látszata is hiányzik, kreatív, bátor konstrukciók, maximális érthetőség, a bonyolult problémák esetén is közérthető fogalmazás, élvezetes, kiváló nyelvhasználat… hogy csak néhányat említsek.”_\n\ndr. Nahalka István oktatáskutató\n\nAlexovics Ingrid beszélget Knausz Imrével a könyvről a [Látszótér Rádióban](https://latszoter.hu/radio/beszelgetes-knausz-imrevel-0?fbclid=IwAR0KXOMnlf6wvOQuzupOaQtzxiWnO_tV5eYqNINp5KkUtSOBxQM0DzP2CHA).\n\n_Szerintünk ennek a könyvnek a piaci ára 3490 Ft lenne. Ha úgy érzi, szívesen kifizetné, kérjük, utalja át ezt az összeget a miskolci Erzsébet Hospice Alapítvány számlájára. A számlaszám:\_11734004-20394369. Köszönjük!_"
