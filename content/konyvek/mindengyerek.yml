description: "A könyvben szereplő írások az elmúlt években születtek, \_de az írást kiváltó helyzetek, okok nem változtak. A könyv \_első két része az okokat járja körül, a harmadik rész az Igazgyöngy modell működésével és módszertanával foglalkozik. \_Mivel az oktatás mindenkit érint közvetve vagy közvetlenül, \_ezért nem csak a szakembereknek lehet érdekes a könyv tartalma.\n\nA magyar oktatási rendszer megbukott. Esélykiegyenlítés és esélyteremtés helyett inkább a különbségek növelése \_a jellemzője. Miért? Mik az okok? L. Ritók Nóra az okokat \_kutatja, napi munkájában pedig azért harcol, hogy a feltárt \_vagy éppen nyilvánvaló okokat megszüntesse. Egy civilnek \_soha nincs annyi eszköz a kezében, hogy rendszerszintű változásokat érjen el, de a terepi tapasztalatait, módszertanát \_felhasználva tehetünk a leszakadás ellen. A tanulók ne kötelező rossznak éljék meg az iskolát, legyen az a gondolkodásra, önállóságra, kreativitásra nevelő, sikerélményt biztosító \_iskola, ahova tanár és diák egyaránt szívesen megy.\n\nJó lenne, ha a könyvben szereplő írások többsége néhány \_év múlva csak egy rossz pillanat lenyomatai lennének, egy \_kor dokumentumai, amit szívesen elfelejtünk.\n\n\"Javaslata az, hogy a leendő pedagógusok tanulmányaik alatt ne csak az átlaggyerekre fókuszáljanak, hanem kapjanak felkészítést a hátrányos helyzetű gyerekek fejlesztésére is. … Jelen kötet tökéletesen alkalmas arra, hogy egy ilyen kötelező kurzus kötelező irodalma legyen. Mindent tud és mindent elmond a hátrányos helyzet okairól és kezelési lehetőségeiről. Közérthető, olvasmányos stílusa miatt azonban nemcsak a szociális szférában dolgozó szakembereknek és pedagógusjelölteknek ajánlott az elolvasása, hanem kiváló érzékenyítő olvasmány lehet a többségi társadalom minden tagjának is.\"\n\nDr. Iványi Zsuzsanna nyelvész, intézetvezető egyetemi docens\n\n\"Az ember közelről nézve érti meg – írja Nóra. Csakhogy nem nagyon akar senki sem elég közel menni, elég sokáig ahhoz, hogy az élethelyzetek, folyamatok komplexitását megérthesse. A rizikó kettős: nem csupán derék középosztályi komfortzónák elhagyása borsództat, hanem a szembenézés következtében beálló esetleges kényszer: akkor bizony sok mindent gyökeresen másképpen kell csinálni. Másképpen a támogatásnak nevezett intézkedéseket, másképpen az iskolát, másképpen az ellátórendszerek szervezését, másképpen a foglalkoztatást…\"\n\nErcse Kriszta oktatáskutató\n\nSzerintünk ennek a könyvnek a piaci ára 3990 Ft lenne. Ha úgy érzi, szívesen kifizetné, kérjük, utalja át ezt az összeget az Igazgyöngy Alapítvány számlájára. A közleményben tüntesse fel: Toldi Tanoda. A számlaszám:\_11738046-20048343. Köszönjük!"
