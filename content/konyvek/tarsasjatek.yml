description: "A kötet a társasjáték-pedagógia elvi alapjait igyekszik rögzíteni, segítséget nyújtva mindazoknak, akik pedagógiai célokkal társasjátékokhoz fordulnának. Minden jó játék a játékon belüli probléma megoldására motiválja a gyereket. Teszi ezt úgy, hogy újabb és újabb problémák meghatározásához és megoldásához csinál kedvet. A szerzők a játék általi, de játékon belüli fejlődés meghatározását tűzték ki célul. Azt szeretnék, ha egyre többen hinnék el, hogy van értelme társasjátékokkal foglalkozni, és hagyni kicsit játszani a gyerekeket, akár direkt fejlesztési szituációk helyett is. A pedagógiai és pszichológiai alapoktól indulva, a játék meghatározásán át a társasjáték-pedagógiai alapvetésekig jutnak el, hogy bemutassák az általuk tapasztalt fejlesztő hatásokat, kísérletet téve arra, hogy létrehozzanak egy olyan eszközt, mely képes mérni és értékelni a gyerekek játékban nyújtott teljesítményét. A könyvet az összegzés mellett egy játékajánló zárja, ahol néhány megkerülhetetlen társasjáték pedagógiai elemzésére kerül sor.\n\n_\"Az iskola megújulásra vár, és szükség van bátor kezdeményezésekre, egyszerű és hatékony utak felmutatására, a régi, bevált eszközök új szemléletbe helyezésre, ehhez pedig a módszerek tiszta értelmezésére. A Társasjáték-pedagógia éppen ezt teszi. Bemutatja, hogy mi a játék, és mi nem a játék, mi az, amivel élni kell, ha tanulásról van szó, és mik lehetnek a buktatók. Mindezzel nem csak a társasjátékok, hanem általában a játékok és elsősorban is a tanítás terén szemléletformáló kiadvány.\"_\n\nDr. Gyarmathy Éva, az MTA TTK Kognitív Idegtudományi és Pszichológiai Intézetének tudományos főmunkatársa\n\n_\"A Társasjáték-pedagógia legfontosabb üzenete számomra az, hogy a társasjátékokkal olyan széleskörű kompetencia fejlesztést indíthatunk el, amely más eszközzel nemigen érhető el, és amelyre az iskolai nevelésnek feltétlenül szüksége van.\"_\n\nMészáros Mihály matematikatanár, a hejőkeresztúri táblajátékos rendszer kidolgozója\n\nParts of the book are already available in English on the [PlayWise website](https://playwise.education/educational-board-games).\n\n_Szerintünk ennek a könyvnek a piaci ára 1490 Ft lenne. Ha úgy érzi, szívesen kifizetné, kérjük, utalja át ezt az összeget az Igazgyöngy Alapítvány számlájára. A közleményben tüntesse fel: Toldi Tanoda. A számlaszám:\_11738046-20048343. Köszönjük!_"
