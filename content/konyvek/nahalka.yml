description: "\"Vagyis e tanulmányban nem teszek kísérletet valamelyik paradigma „igazságának bizonyítására”, radikális konstruktivista ismeretelméleti beállítottságom ezt nem is tenné lehetővé. Amit tehetek, talán az sem kevés: (1) bemutatom az ebben a diskurzusban szerephez jutó, modellszerű paradigmákat. Saját elemzésem szerint ezekből nem is kettő, hanem három van. Ezek a konzervatív, a reformpedagógiai és a konstruktivista modellek. Mindhárom gondolkodási rendszer meg is valósul a gyakorlatban „tisztán” is, konkrét iskolarendszerekben, de még inkább egyes iskolákban. Ugyanakkor a ma a világban működő oktatási intézményeket jellemző pedagógiai nézetrendszerek (paradigmák) esetében egy negyedikről is kell beszélni: a „tiszta”, modellszerű elvrendszereket ötvöző, s azokat a neoliberalizmus oktatásra kifejtett hatásával is összemosó eklektikus megvalósulásokat. Eközben (1) nem az igazság, hanem a tudományos, oktatásfejlesztési és praxisbéli adaptivitás szempontjából való összehasonlításuk izgat, (2) fontosabb kérdésekben el is végzem ezt az összehasonlítást, (3) kimutatom a paradigmák néhány belső gyengeségét.\" (Nahalka István)\n\n\"Műfaját tekintve egy tudós kiáltványának látom, aki 72 oldalon keresztül lépésről lépesre vezeti, szemléletes példákkal segíti az olvasót, hogy megértse, megértsük, mi is történik velünk (és mi nem) tanulás-tanítás, illetve a tudás mibenlétéről folyó vita közben. Kiáltványként olvasom, mintha a szerző felrázni szeretné hivatásrendünket (ezt a szót ritkán használjuk, pedig megemel bennünket) – oktatáspolitikusokat, tanárokat – gondoljuk végig, miről is van szó, amikor tantervről, annak tartalmáról, terjedelméről , követelményekről, értékelésről beszélünk. A szerzőtől feltehetően idegen ez a műfaji besorolás, hiszen a könyvterjedelmű tanulmány bemutatja, elemzi, bizonyítja, melyik az a három, voltaképpen négy nézetrendszer (paradigma) amely az aktuális oktatáspolitikai vitákban jelen van, s mi is a valódi viszonya mindehhez a (radikális) konstruktivizmusnak.\" (Kereszty Zsuzsa)\n\n\"Nahalka István sajátos műfajú szöveggel reagál egy félig sürgetően aktuális, félig krónikusan felszín alatti vitára, az úgynevezett konzervatív és az úgynevezett progresszív pedagógia között. Bevallása szerint paradigmatikusan szakít az akadémia műfaji elvárásaival annak érdekében, hogy szélesebb olvasóközönséget szólítson meg – ugyanakkor sem gondolatmenetének súlya, sem megalapozottsága nem árulkodik különösebb minőségi kompromisszumokról. Sokakkal együtt kénytelen hinni a „művelt nagyközönség” létezésében, mely, ha csak a pályán lévő, szegről-végről diplomás értelmiségi\_pedagógusok számát vesszük alapul, reméljük alapos hit. Illetve konstrukció.\" (Gloviczki Zoltán)\n\n_Szerintünk ennek a könyvnek a piaci ára 2990 Ft lenne. Ha úgy érzi, szívesen kifizetné, kérjük, utalja át ezt az összeget a\_CKP Alapítvány a Tanszabadságért számlájára. A számlaszám: 16200010 – 10134339._"
