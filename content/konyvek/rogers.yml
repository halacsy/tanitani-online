description: "A Carl Rogers Személyközpontú Iskola Alapítvány 1990 óta tartja fenn személyközpontú szemléletű általános iskoláját. 30 éve fogalmazódott meg az álom, csinálhatnánk egy olyan iskolát, ahol a gyerekek és felnőttek személyes viszonyban vannak egymással és ez legalább olyan fontos eleme az életünknek, mint az, hogy mit kell tanulni. Ahol az iskolai kötelező anyagon túl, sokszínű és sokszintű, a mindennapok során jól alkalmazható ismerethez jutnak diákjaink. Olyan iskolát, ahova a gyerekek szeretnek járni. A 30 év alatt nagyon sok tapasztalattal lettünk gazdagabbak és sok kedves emléket őrzünk az elmúlt évekről. Ezeket szerettük volna megírni és a jövő számára maradandóvá tenni egy könyvben.\n\nA személyközpontúság fogalmát a modern pedagógiában többnyire az egyénre való kiemelt odafigyelésként értelmezik, pedig az eredeti, Carl Rogers amerikai pszichológustól származó fogalom ennél sokkal árnyaltabb és komplexebb megközelítést jelent. A rogersi személyközpontúság stílus, szemlélet és megközelítésmód is egyben. Ezt a létezési módot akarta érzékletessé tenni Dobos Orsolya, a könyv szerkesztője, aki évek óta tervezte egy olyan szakmai könyv megírását, amely az iskola tapasztalatainak és eredményeinek nyilvánosságot ad. Ez a szándék találkozott a Rogers Iskola tervével, hogy könyvet jelentessen meg az elmúlt 30 év tapasztalatairól. A könyv szakértői elemzéseket és személyes emlékeket együtt tartalmaz.\n\n„A Rogers Iskola emberközelivé varázsolt komplex «iskolatörténete» segít eloszlatni az alternatív iskolákkal kapcsolatos kritikákat és kételyeket, segíti a nevelésről kialakított koncepciók újra értelmezését. Fontos és hasznos forrása lehet a tanárképzés sokféle gyakorlatának, de napi szinten a pedagógiai gyakorlat megújulását szolgáló elméletek és gyakorlatok egyik iránymutatója is. Miért is? Hogy boldog gyermekek és még boldogabb, az életben helyüket megtaláló felnőttek generációi kerülhessenek ki az iskolák világából.”  \nVincze Beatrix habilitált egyetemi docens, ELTE PPK\n\n\_„Ami itt a harminc év alatt összegyűlt, az nagyon sokat tud adni más iskolacsinálóknak, pedagógusoknak, jövendő pedagógusoknak egyaránt, és remélem, szülőknek is. Szerettem volna, ha sokakhoz szól, ezért tudományos igényű írások, módszertani ötletek és személyes élmények is kerültek a kötetbe. Bár a szakmai témákra fókuszáltam, az iskola harminc évének számos olyan eleme is rekonstruálható, amelyek érzelmileg fontosak nekünk.”  \nDobos Orsolya szerkesztő\n\n\_„Ha érdekli, miért képesek akár 7-8 évesek is konfliktusmegoldásra; ha tudni szeretné, hogyan fejlődhet lelkileg-szellemileg a pedagógus „tanítás közben” akárhány évesen is; ha\_kíváncsi arra, milyen is a valódi személyközpontú pedagógia; ha úgy érzi, kiégett; ha\_ lehetetlennek tartja, hogy valaki, aki belülről ismeri, «csodának» lásson egy iskolát: akkor – akár kikapcsolódásul is – olvassa a Rogers Iskola\_ csodája című könyvet.”  \nKereszty Zsuzsa ny. főiskolai docens\n\nSzerintünk ennek a könyvnek a piaci ára 3490 Ft lenne. Ha úgy érzi, szívesen kifizetné, kérjük, utalja át ezt az összeget Mahájána Alapítvány, Csörögi Tanoda\_ számlájára. A számlaszám: 11713012-20004161. Köszönjük!"
